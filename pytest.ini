[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    slow: marks tests as intentionally slow.
    integration: marks end-to-end tests that exercise the FastAPI application.
filterwarnings =
    ignore::DeprecationWarning
